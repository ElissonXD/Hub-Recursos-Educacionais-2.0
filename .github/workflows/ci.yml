name: CI - Lint e Qualidade

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-check:
    name: Linting (Back & Front)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Backend Lint
      - name: Install & Lint Backend
        run: |
          cd backend
          npm install --no-audit --no-fund
          npm run lint
        continue-on-error: true

      # Frontend Lint
      - name: Install & Lint Frontend
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run lint 
        continue-on-error: true