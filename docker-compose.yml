version: '3.8'
services:
      backend:
        build:
          image: dockerfile
          context: ./backend
        ports:
          - "5000:5000"
        env_file:
          - .env
        depends_on:
          - db
      db:
        image: postgres:18.4
        restart: always
        env_file:
          - .env
        ports:
          - "5432:5432"
        volumes:
          - postgres_data:/var/lib/postgresql/data
      frontend:
        build:
          image: dockerfile
          context: ./frontend
        ports:
          - "3000:3000"
        env_file:
          - .env
        depends_on:
          - backend
        
